---
name: Sync upstream NICo release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Find oldest missing upstream release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.missing.outputs.version }}
      has_missing: ${{ steps.missing.outputs.has_missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find oldest missing upstream release
        id: missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream=$(gh api repos/NVIDIA/infra-controller/tags --paginate \
            --jq '.[] | select(.name | test("^v[2-9][0-9]*\\.[0-9]+\\.[0-9]+$")) | .name | ltrimstr("v")' \
            | sort -Vu)

          # Use git tags as source of truth — immediately available after a sync run
          git fetch --tags
          published=$(git tag | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu)

          echo "Upstream: $(echo "${upstream}" | tr '\n' ' ')"
          echo "Published: $(echo "${published}" | tr '\n' ' ')"

          version=$(comm -23 \
            <(echo "${upstream}") \
            <(echo "${published}") \
            | head -1)

          if [ -n "${version}" ]; then
            echo "Oldest missing: ${version}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "All upstream releases are published."
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Sync ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.has_missing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ansible-core ansible-lint pyyaml pytest

      - name: Download upstream spec
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/NVIDIA/infra-controller/v${VERSION}/rest-api/openapi/spec.yaml" \
            -o /tmp/spec.yaml

      - name: Regenerate modules
        run: python scripts/generate.py --spec /tmp/spec.yaml --output plugins/modules

      - name: Bump collection version and README
        run: |
          python3 -c "
          import re, os
          v = os.environ['VERSION']
          for path, pattern, repl in [
              ('galaxy.yml', r'^version: .*', f'version: {v}'),
              ('README.md',  r'version-[\d.]+-blue', f'version-{v}-blue'),
              ('README.md',  r'nvidia-infra_controller-[\d.]+\.tar\.gz',
                             f'nvidia-infra_controller-{v}.tar.gz'),
          ]:
              txt = open(path).read()
              txt = re.sub(pattern, repl, txt, flags=re.MULTILINE)
              open(path, 'w').write(txt)
          "

      - name: Lint
        run: |
          make lint
          ansible-lint plugins/

      - name: Unit tests
        run: make test

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add galaxy.yml README.md plugins/modules/
          git diff --cached --stat
          git commit -s -m "Regenerate modules for upstream release v${VERSION}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git tag "${VERSION}" -m "Release ${VERSION}"
          git push origin main "${VERSION}"

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    needs: [check, sync]
    uses: ./.github/workflows/_publish.yml
    with:
      version: ${{ needs.check.outputs.version }}
    permissions:
      contents: write
